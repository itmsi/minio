services:
  minio:
    image: minio/minio:latest
    container_name: cloudstorage-minio
    ports:
      - "9508:9000"    # MinIO S3 API
      - "9507:9001"    # MinIO Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Rubysa179596!
    volumes:
      - /home/msiserver/cloudstorage/data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true