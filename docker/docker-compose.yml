services:
  minio:
    image: minio/minio:latest
    container_name: cloudstorage-minio
    # Port mapping dihapus karena akan diakses via Traefik
    # ports:
    #   - "9508:9000"    # MinIO S3 API
    #   - "9507:9001"    # MinIO Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Rubysa179596!
    volumes:
      - /home/msiserver/minio/data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # Router untuk MinIO S3 API (port 9000) - HTTPS
      - "traefik.http.routers.minio-api.rule=Host(`minio-api.motorsights.com`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      
      # Redirect HTTP ke HTTPS untuk S3 API
      - "traefik.http.routers.minio-api-http.rule=Host(`minio-api.motorsights.com`)"
      - "traefik.http.routers.minio-api-http.entrypoints=web"
      - "traefik.http.routers.minio-api-http.middlewares=minio-api-redirect"
      - "traefik.http.middlewares.minio-api-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.minio-api-redirect.redirectscheme.permanent=true"
      
      # Router untuk MinIO Console (port 9001) - HTTPS
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.motorsights.com`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
      
      # Redirect HTTP ke HTTPS untuk Console
      - "traefik.http.routers.minio-console-http.rule=Host(`minio-console.motorsights.com`)"
      - "traefik.http.routers.minio-console-http.entrypoints=web"
      - "traefik.http.routers.minio-console-http.middlewares=minio-console-redirect"
      - "traefik.http.middlewares.minio-console-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.minio-console-redirect.redirectscheme.permanent=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  traefik-network:
    external: true
    name: traefik-network