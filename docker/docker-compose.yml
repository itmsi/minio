services:
  minio:
    image: minio/minio:latest
    container_name: cloudstorage-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Rubysa179596!
    volumes:
      - /home/msiserver/minio/data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # Router untuk MinIO S3 API (port 9000) - HTTP (Cloudflare handle HTTPS)
      - "traefik.http.routers.minio-api.rule=Host(`minio-api.motorsights.com`)"
      - "traefik.http.routers.minio-api.entrypoints=web"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      
      # Router untuk MinIO Console (port 9001) - HTTP (Cloudflare handle HTTPS)
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.motorsights.com`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
      
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

# TAMBAHKAN INI:
networks:
  traefik-network:
    external: true  # PENTING! Gunakan network yang sudah ada
    name: traefik-network  # Nama network yang sama dengan Traefik