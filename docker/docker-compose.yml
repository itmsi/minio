services:
  minio:
    image: minio/minio:latest
    container_name: cloudstorage-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Rubysa179596!
    volumes:
      - /home/msiserver/minio/data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - infra_net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  infra_net:
    external: true
    name: infra_net