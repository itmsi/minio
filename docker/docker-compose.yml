services:
  minio:
    image: minio/minio:latest
    container_name: cloudstorage-minio

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Rubysa179596!
      MINIO_SERVER_URL: https://minio-api.motorsights.com
      MINIO_BROWSER_REDIRECT_URL: https://minio-console.motorsights.com

    volumes:
      # Opsi 1: Named Volume (Recommended - lebih reliable)
      - minio_data:/data
      
      # Opsi 2: Bind Mount (jika perlu akses langsung ke filesystem)
      # - /home/msiserver/minio/data:/data

    command: server /data --console-address ":9001"

    restart: unless-stopped

    networks:
      - infra_net

volumes:
  minio_data:
    driver: local
    # Opsi: Jika ingin menggunakan bind mount, uncomment baris di bawah
    # dan comment baris volumes di atas
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /home/msiserver/minio/data

networks:
  infra_net:
    external: true
